<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Responsive Image Slider Library using HTML, CSS and JavaScript">

    <title>Responsive Image Slider Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Responsive Image Slider</h1>
        <p>Image Slider Library Using Vanilla JavaScript</p>
    </header>

    <main>

        <section class="slider-section"
                 aria-label="Image Slider">

            <div class="slider">

                <div class="slider-window">

                    <div class="slider-track"
                         id="sliderTrack">

                        <div class="slide">
                            <img src="images/image1.jpg"
                                 alt="Mountain landscape">
                        </div>

                        <div class="slide">
                            <img src="images/image2.jpg"
                                 alt="Natural scenery">
                        </div>

                        <div class="slide">
                            <img src="images/image3.jpg"
                                 alt="City view">
                        </div>

                        <div class="slide">
                            <img src="images/image4.jpg"
                                 alt="Forest landscape">
                        </div>

                        <div class="slide">
                            <img src="images/image5.jpg"
                                 alt="Beautiful sunset">
                        </div>

                    </div>

                </div>

                <button class="slider-button previous"
                        id="previousButton"
                        aria-label="Previous image">
                    &#10094;
                </button>

                <button class="slider-button next"
                        id="nextButton"
                        aria-label="Next image">
                    &#10095;
                </button>

            </div>

            <div class="slider-dots"
                 id="sliderDots"
                 aria-label="Slide navigation">
            </div>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Riya Shakya -
            Responsive Image Slider Library
        </p>
    </footer>

    <script src="slider.js"></script>

</body>
</html>
